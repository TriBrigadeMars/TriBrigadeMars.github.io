<text x="633.0" y="86" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#12214A" text-anchor="middle">Climate</text>
<polygon points="754,7 998,7 1016,64.0 998,121 754,121 772,64.0" fill="#12214A" stroke="#12214A" stroke-width="2"/>
