<text x="104" y="40" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#12214A" text-anchor="start" letter-spacing="1.0">DIRECT</text>
<text x="104" y="69" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#12214A" text-anchor="start">In the Moment</text>
<rect x="12" y="96" width="476" height="78" rx="12" fill="#F2ECE1" stroke="#E2D9CC" stroke-width="2"/>
<rect x="12" y="96" width="10" height="78" rx="4" fill="#CFB87C"/>
