<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="500" height="450" role="img" aria-labelledby="t d">
<title id="t">The five Ds of bystander intervention</title>
<desc id="d">Five numbered cards for the upstander toolkit: direct, distract, delegate, delay, and document.</desc>
<rect x="12" y="6" width="476" height="78" rx="12" fill="#CFB87C" stroke="#12214A" stroke-width="2"/>
